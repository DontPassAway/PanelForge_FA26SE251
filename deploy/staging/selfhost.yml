# Chạy staging trên một máy bất kỳ có Docker (vd máy cá nhân) khi chưa có VM:
#   docker compose -f docker-compose.yml -f selfhost.yml up -d --build
# Không mở cổng nào ra ngoài: Cloudflare quick tunnel đưa API ra một URL https://*.trycloudflare.com
# (xem: docker compose logs tunnel). URL đổi mỗi lần container tunnel khởi động lại.
services:
  caddy:
    profiles: ["vm"] # Cloudflare lo HTTPS, không cần Caddy và cổng 80/443 trên máy

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:8080
    depends_on: [api]

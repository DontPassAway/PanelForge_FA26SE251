version: '3.8'

services:
  postgres-db:
    image: postgres:17-alpine
    container_name: panelforge_postgres
    restart: always
    environment:
      POSTGRES_DB: panelforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      # Đổi tên ở đây
      - panelforge_data:/var/lib/postgresql/data

  panelforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panelforge_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQL=Host=postgres-db;Port=5432;Database=panelforge;Username=postgres;Password=12345
      - TranslationService__BaseUrl=http://translation-service:5000
      # API Key webhook SePay (đặt trong file .env cạnh compose, không commit). Để trống = tắt webhook (trả 503).
      - SePay__WebhookApiKey=${SEPAY_WEBHOOK_API_KEY:-}
      # TASK-354: AI service cùng mạng Docker. AI_SERVICE_KEY đặt trong .env (không commit), giống bên panelforge-ai.
      - AiService__ServiceUrl=http://panelforge-ai:5055
      - AiService__ServiceKey=${AI_SERVICE_KEY:-}
      # TASK-352: khoá Data Protection nằm trên volume để API key AI không mất khi dựng lại container
      - DataProtection__KeysPath=/app/dpkeys
    volumes:
      - panelforge_dpkeys:/app/dpkeys
    ports:
      - "7274:8080"
    depends_on:
      - postgres-db
      - translation-service
      - panelforge-ai

  panelforge-ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: panelforge_ai
    restart: always
    environment:
      - Backend__BaseUrl=http://panelforge-api:8080
      - AiService__ServiceKey=${AI_SERVICE_KEY:-}
    # Không publish port: chỉ panelforge-api gọi qua mạng nội bộ.

  translation-service:
    image: libretranslate/libretranslate:latest
    container_name: panelforge_translation
    restart: always
    environment:
      - LT_LOAD_ONLY=en,vi
      - LT_DISABLE_WEB_UI=true
    ports:
      - "5000:5000"

volumes:
  # Và đổi tên ở đây
  panelforge_data:
  # TASK-352: khoá Data Protection của API
  panelforge_dpkeys:
